[project]
name = "imba-radar"
version = "1.0.0"
description = "Minute-level GitHub imba radar: curated cards with previews into topic branches"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.scripts]
imba-radar = "imba_radar.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
